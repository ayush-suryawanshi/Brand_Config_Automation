{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apple Inspired</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            width: 100%;
            background-color: #0071e3;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: 500;
            text-align: left;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 100px;
            margin-bottom: 100px; /* 👈 extra spacing above the bottom bar */
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background-color: #0071e3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        footer {
            margin-top: 20px;
            text-align: left;
        }
        .forgot {
            font-size: 14px;
            color: #0071e3;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .bottom-bar {
            width: 100%;
            background-color: #0071e3;
            height: 40px;
            position: fixed;
            bottom: 0;
            left: 0;
            color: white;
            text-align: center;
            line-height: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        Scheme Approval Portal
    </div>

    <div class="container">
        <h2>Sign in</h2>
        <form method="POST" action="/login_user/">
            {% csrf_token %}
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <footer>
            <a class="forgot" href="password-reset/">Forgot your password?</a>
        </footer>
    </div>

    <div class="bottom-bar">
        &copy; 2025 Scheme Approval Portal
    </div>
</body>
</html>
