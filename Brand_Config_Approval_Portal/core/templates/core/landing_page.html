{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Selection</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0071e3;
            color: white;
            padding: 20px 40px;
            text-align: left;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
            flex-grow: 1;
        }

        .card {
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            font-size: 28px;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .oppo { background-color: #00a884; }
        .realme { background-color: #ffd400; color: #1d1d1f; }
        .samsung { background-color: #1428a0; }
        .vivo { background-color: #3a3aff; }
        .xiaomi { background-color: #ff6900; }
        .motorola { background-color: #5c2d91; }

        footer {
            background-color: #0071e3;
            color: white;
            padding: 15px 40px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header>
        Scheme Approval Portal
    </header>

    <main>
        <a href="/oppo/email_selection" class="card oppo">Oppo</a>
        <a href="/realme/email_selection" class="card realme">Realme</a>
        <a href="/samsung/email_selection" class="card samsung">Samsung</a>
        <a href="/vivo/email_selection" class="card vivo">Vivo</a>
        <a href="/xiaomi/email_selection" class="card xiaomi">Xiaomi</a>
        <a href="/motorola/email_selection" class="card motorola">Motorola</a>
    </main>

    <footer>
        &copy; 2025 Innoviti Technologies
    </footer>
</body>
</html>
